<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" lang="ar" role="img" aria-labelledby="title description">
  <title id="title">بنية نظام حرف</title>
  <desc id="description">تنتقل ضغطات المفاتيح من التطبيق الحالي إلى الالتقاط والذاكرة المؤقتة والمقارنة بين التخطيطين العربي والإنجليزي. يجب اجتياز فحص الأمان قبل استبدال النص في التطبيق الأصلي. كل المكوّنات تعمل محليًا على جهازك.</desc>
  <style>
    text{font-family:SFMono-Regular,Consolas,monospace;font-size:19px;font-weight:600;fill:#e6e6e1}
    .slab path{stroke:#787a73;stroke-width:1;stroke-linejoin:miter}
    .face{fill:#242424}.side{fill:#191919}.front{fill:#1c1c1c}
    .yellow path{stroke:#94d5cb}.yellow .face{fill:#21473d}.yellow .side,.yellow .front{fill:#142d27}
    .blue path{stroke:#b0a5f5}.blue .face{fill:#31264d}.blue .side,.blue .front{fill:#211a35}
    .sub{font-size:12px;fill:#aaa;font-weight:400}.plane{fill:none;stroke:#4b4d4a;stroke-width:1}
    .wire{fill:none;stroke:#64655e;stroke-width:1;stroke-dasharray:4 6}
    .model-wire{stroke:#7160df}.label{font-size:12px;font-weight:400;fill:#a6a7a0;letter-spacing:1px}
    .tag{font-size:11px;font-weight:400;fill:#878981}
  text{font-family:Tahoma,Arial,sans-serif;direction:rtl;text-anchor:end;letter-spacing:0}.slab text{text-anchor:middle}.label{font-size:13px}.tag{font-size:12px}
  </style>
